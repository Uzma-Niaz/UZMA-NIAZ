  <rect width="1200" height="374" fill="url(#grid)"/>
  <rect width="1200" height="374" fill="url(#scan)"/>
</g>
<rect x="2" y="2" width="1196" height="370" rx="18" fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#blur8)" opacity=".45">
