<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="396" viewBox="0 0 1200 396" role="img" aria-label="About Me"><title>About Me</title><style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}
.sans{font-family:'Space Grotesk','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif;font-weight:800}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10131F"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F6BFF"/><stop offset=".55" stop-color="#5AE0FF"/><stop offset="1" stop-color="#8F6BFF"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8F6BFF" stroke-opacity=".07"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" fill-opacity=".022"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>

</defs>
<clipPath id="cardclip"><rect x="2" y="2" width="1196" height="392" rx="18"/></clipPath>
<g clip-path="url(#cardclip)">
  <rect width="1200" height="396" fill="url(#bg)"/>
  <rect width="1200" height="396" fill="url(#grid)"/>
  <rect width="1200" height="396" fill="url(#scan)"/>
</g>
<rect x="2" y="2" width="1196" height="392" rx="18" fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#blur8)" opacity=".45">
  <animate attributeName="opacity" values=".25;.6;.25" dur="6s" repeatCount="indefinite"/>
</rect>
<rect x="2" y="2" width="1196" height="392" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.2" stroke-opacity=".85"/>
<text x="36" y="46" class="mono" font-size="13" letter-spacing="3" fill="#F5B800">// ABOUT ME</text>
<text x="36" y="84" class="sans" font-size="30" fill="#E6E8F2">About Me</text>
<rect x="36" y="98" width="56" height="3" rx="1.5" fill="#8F6BFF" filter="url(#glow)">
  <animate attributeName="width" values="56;96;56" dur="5s" repeatCount="indefinite"/>
</rect>
<clipPath id="ln0"><rect x="36" y="122" height="26" width="0">
  <animate attributeName="width" values="0;635" begin="0.00s" dur="2.21s" fill="freeze"/></rect></clipPath>
<text x="40" y="140" class="mono" font-size="16" fill="#E6E8F2" clip-path="url(#ln0)">Computer Science student who loves turning repetitive work into</text>
<clipPath id="ln1"><rect x="36" y="150" height="26" width="0">
  <animate attributeName="width" values="0;215" begin="2.35s" dur="0.70s" fill="freeze"/></rect></clipPath>
<text x="40" y="168" class="mono" font-size="16" fill="#E6E8F2" clip-path="url(#ln1)">automated workflows.</text>
<clipPath id="ln3"><rect x="36" y="190" height="26" width="0">
  <animate attributeName="width" values="0;567" begin="3.21s" dur="1.96s" fill="freeze"/></rect></clipPath>
<text x="40" y="208" class="mono" font-size="16" fill="#E6E8F2" clip-path="url(#ln3)">I build AI automations in n8n: resume screening, invoice</text>
<clipPath id="ln4"><rect x="36" y="218" height="26" width="0">
  <animate attributeName="width" values="0;596" begin="5.32s" dur="2.07s" fill="freeze"/></rect></clipPath>
<text x="40" y="236" class="mono" font-size="16" fill="#E6E8F2" clip-path="url(#ln4)">processing, feedback handling and RAG knowledge assistants.</text>
<clipPath id="ln6"><rect x="36" y="258" height="26" width="0">
  <animate attributeName="width" values="0;625" begin="7.53s" dur="2.17s" fill="freeze"/></rect></clipPath>
<text x="40" y="276" class="mono" font-size="16" fill="#E6E8F2" clip-path="url(#ln6)">Strengthening my programming foundations in C++ and JavaScript</text>
<clipPath id="ln7"><rect x="36" y="286" height="26" width="0">
  <animate attributeName="width" values="0;157" begin="9.85s" dur="0.60s" fill="freeze"/></rect></clipPath>
<text x="40" y="304" class="mono" font-size="16" fill="#E6E8F2" clip-path="url(#ln7)">along the way.</text>
<clipPath id="ln9"><rect x="36" y="326" height="26" width="0">
  <animate attributeName="width" values="0;625" begin="10.60s" dur="2.17s" fill="freeze"/></rect></clipPath>
<text x="40" y="344" class="mono" font-size="16" fill="#E6E8F2" clip-path="url(#ln9)">Open to beginner-friendly open-source and automation projects.</text>
<rect x="776" y="124" width="1" height="222" fill="#8F6BFF" opacity=".35"/>
<text x="800" y="140" class="mono" font-size="12" letter-spacing="3" fill="#F5B800">ROLE</text>
<text x="800" y="166" class="sans" font-size="20" fill="#5AE0FF">AI Automation Expert</text>
<text x="800" y="208" class="mono" font-size="12" letter-spacing="3" fill="#F5B800">WORKING ON</text>
<g><circle cx="805" cy="231" r="4" fill="#8F6BFF" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="0s" repeatCount="indefinite"/></circle><text x="820" y="236" class="mono" font-size="14" fill="#E6E8F2">n8n workflows &amp; webhooks</text></g>
<g><circle cx="805" cy="259" r="4" fill="#8F6BFF" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="1s" repeatCount="indefinite"/></circle><text x="820" y="264" class="mono" font-size="14" fill="#E6E8F2">AI agents &amp; RAG assistants</text></g>
<g><circle cx="805" cy="287" r="4" fill="#8F6BFF" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="2s" repeatCount="indefinite"/></circle><text x="820" y="292" class="mono" font-size="14" fill="#E6E8F2">Document &amp; invoice automation</text></g>
<g><circle cx="805" cy="315" r="4" fill="#8F6BFF" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="3s" repeatCount="indefinite"/></circle><text x="820" y="320" class="mono" font-size="14" fill="#E6E8F2">C++ / JavaScript fundamentals</text></g></svg>
