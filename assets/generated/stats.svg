<svg xmlns="http://www.w3.org/2000/svg" width="580" height="376" viewBox="0 0 580 376" role="img" aria-label="Stats"><title>Stats</title><style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}
.sans{font-family:'Space Grotesk','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif;font-weight:800}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10131F"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F6BFF"/><stop offset=".55" stop-color="#5AE0FF"/><stop offset="1" stop-color="#8F6BFF"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8F6BFF" stroke-opacity=".07"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" fill-opacity=".022"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>

</defs>
<clipPath id="cardclip"><rect x="2" y="2" width="576" height="372" rx="18"/></clipPath>
<g clip-path="url(#cardclip)">
  <rect width="580" height="376" fill="url(#bg)"/>
  <rect width="580" height="376" fill="url(#grid)"/>
  <rect width="580" height="376" fill="url(#scan)"/>
</g>
<rect x="2" y="2" width="576" height="372" rx="18" fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#blur8)" opacity=".45">
  <animate attributeName="opacity" values=".25;.6;.25" dur="6s" repeatCount="indefinite"/>
</rect>
<rect x="2" y="2" width="576" height="372" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.2" stroke-opacity=".85"/>
<text x="36" y="46" class="mono" font-size="13" letter-spacing="3" fill="#F5B800">// GITHUB STATS</text>
<text x="36" y="84" class="sans" font-size="30" fill="#E6E8F2">Stats</text>
<rect x="36" y="98" width="56" height="3" rx="1.5" fill="#8F6BFF" filter="url(#glow)">
  <animate attributeName="width" values="56;96;56" dur="5s" repeatCount="indefinite"/>
</rect>
<text x="40" y="140" class="mono" font-size="16" fill="#F5B800" filter="url(#glow)">★</text><text x="70" y="140" class="mono" font-size="15" fill="#E6E8F2">Total stars</text><text x="540" y="140" text-anchor="end" class="sans" font-size="20" fill="#F5B800">7<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.00s" fill="freeze"/></text><rect x="70" y="150" width="470" height="1" fill="#8F6BFF" opacity=".18"/>
<text x="40" y="178" class="mono" font-size="16" fill="#8F6BFF" filter="url(#glow)">◆</text><text x="70" y="178" class="mono" font-size="15" fill="#E6E8F2">Commits (last 12 months)</text><text x="540" y="178" text-anchor="end" class="sans" font-size="20" fill="#8F6BFF">11<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.25s" fill="freeze"/></text><rect x="70" y="188" width="470" height="1" fill="#8F6BFF" opacity=".18"/>
<text x="40" y="216" class="mono" font-size="16" fill="#5AE0FF" filter="url(#glow)">⇄</text><text x="70" y="216" class="mono" font-size="15" fill="#E6E8F2">Pull requests</text><text x="540" y="216" text-anchor="end" class="sans" font-size="20" fill="#5AE0FF">0<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.50s" fill="freeze"/></text><rect x="70" y="226" width="470" height="1" fill="#8F6BFF" opacity=".18"/>
<text x="40" y="254" class="mono" font-size="16" fill="#8F6BFF" filter="url(#glow)">!</text><text x="70" y="254" class="mono" font-size="15" fill="#E6E8F2">Issues</text><text x="540" y="254" text-anchor="end" class="sans" font-size="20" fill="#8F6BFF">0<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.75s" fill="freeze"/></text><rect x="70" y="264" width="470" height="1" fill="#8F6BFF" opacity=".18"/>
<text x="40" y="292" class="mono" font-size="16" fill="#5AE0FF" filter="url(#glow)">▣</text><text x="70" y="292" class="mono" font-size="15" fill="#E6E8F2">Public repositories</text><text x="540" y="292" text-anchor="end" class="sans" font-size="20" fill="#5AE0FF">12<animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.00s" fill="freeze"/></text><rect x="70" y="302" width="470" height="1" fill="#8F6BFF" opacity=".18"/>
<text x="40" y="330" class="mono" font-size="16" fill="#F5B800" filter="url(#glow)">☺</text><text x="70" y="330" class="mono" font-size="15" fill="#E6E8F2">Followers</text><text x="540" y="330" text-anchor="end" class="sans" font-size="20" fill="#F5B800">4<animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.25s" fill="freeze"/></text><rect x="70" y="340" width="470" height="1" fill="#8F6BFF" opacity=".18"/></svg>
