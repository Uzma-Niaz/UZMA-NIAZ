<svg xmlns="http://www.w3.org/2000/svg" width="580" height="376" viewBox="0 0 580 376" role="img" aria-label="Top Languages"><title>Top Languages</title><style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}
.sans{font-family:'Space Grotesk','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif;font-weight:800}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10131F"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F6BFF"/><stop offset=".55" stop-color="#5AE0FF"/><stop offset="1" stop-color="#8F6BFF"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8F6BFF" stroke-opacity=".07"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" fill-opacity=".022"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>

</defs>
<clipPath id="cardclip"><rect x="2" y="2" width="576" height="372" rx="18"/></clipPath>
<g clip-path="url(#cardclip)">
  <rect width="580" height="376" fill="url(#bg)"/>
  <rect width="580" height="376" fill="url(#grid)"/>
  <rect width="580" height="376" fill="url(#scan)"/>
</g>
<rect x="2" y="2" width="576" height="372" rx="18" fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#blur8)" opacity=".45">
  <animate attributeName="opacity" values=".25;.6;.25" dur="6s" repeatCount="indefinite"/>
</rect>
<rect x="2" y="2" width="576" height="372" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.2" stroke-opacity=".85"/>
<text x="36" y="46" class="mono" font-size="13" letter-spacing="3" fill="#F5B800">// TOP LANGUAGES</text>
<text x="36" y="84" class="sans" font-size="30" fill="#E6E8F2">Top Languages</text>
<rect x="36" y="98" width="56" height="3" rx="1.5" fill="#8F6BFF" filter="url(#glow)">
  <animate attributeName="width" values="56;96;56" dur="5s" repeatCount="indefinite"/>
</rect>
<clipPath id="bar"><rect x="40" y="128" width="500" height="12" rx="6"/></clipPath><g clip-path="url(#bar)"><rect x="40" y="128" width="500" height="12" fill="#141829"/><rect x="40.0" y="128" width="263.2" height="12" fill="#b07219"/><rect x="303.2" y="128" width="108.9" height="12" fill="#f34b7d"/><rect x="412.1" y="128" width="99.5" height="12" fill="#3572A5"/><rect x="511.6" y="128" width="26.7" height="12" fill="#555555"/><rect x="538.3" y="128" width="0.9" height="12" fill="#663399"/><rect x="539.1" y="128" width="0.9" height="12" fill="#f1e05a"/></g>
<circle cx="46" cy="171" r="6" fill="#b07219" filter="url(#glow)"/><text x="62" y="176" class="mono" font-size="14" fill="#E6E8F2">Java</text><text x="540" y="176" text-anchor="end" class="mono" font-size="14" fill="#9AA3C7">52.6%</text><rect x="62" y="184" width="0" height="3" rx="1.5" fill="#b07219" opacity=".8"><animate attributeName="width" values="0;251.6" dur="1.5s" begin="0.0s" fill="freeze"/></rect>
<circle cx="46" cy="207" r="6" fill="#f34b7d" filter="url(#glow)"/><text x="62" y="212" class="mono" font-size="14" fill="#E6E8F2">C++</text><text x="540" y="212" text-anchor="end" class="mono" font-size="14" fill="#9AA3C7">21.8%</text><rect x="62" y="220" width="0" height="3" rx="1.5" fill="#f34b7d" opacity=".8"><animate attributeName="width" values="0;104.1" dur="1.5s" begin="0.2s" fill="freeze"/></rect>
<circle cx="46" cy="243" r="6" fill="#3572A5" filter="url(#glow)"/><text x="62" y="248" class="mono" font-size="14" fill="#E6E8F2">Python</text><text x="540" y="248" text-anchor="end" class="mono" font-size="14" fill="#9AA3C7">19.9%</text><rect x="62" y="256" width="0" height="3" rx="1.5" fill="#3572A5" opacity=".8"><animate attributeName="width" values="0;95.1" dur="1.5s" begin="0.4s" fill="freeze"/></rect>
<circle cx="46" cy="279" r="6" fill="#555555" filter="url(#glow)"/><text x="62" y="284" class="mono" font-size="14" fill="#E6E8F2">C</text><text x="540" y="284" text-anchor="end" class="mono" font-size="14" fill="#9AA3C7">5.3%</text><rect x="62" y="292" width="0" height="3" rx="1.5" fill="#555555" opacity=".8"><animate attributeName="width" values="0;25.5" dur="1.5s" begin="0.6s" fill="freeze"/></rect>
<circle cx="46" cy="315" r="6" fill="#663399" filter="url(#glow)"/><text x="62" y="320" class="mono" font-size="14" fill="#E6E8F2">CSS</text><text x="540" y="320" text-anchor="end" class="mono" font-size="14" fill="#9AA3C7">0.2%</text><rect x="62" y="328" width="0" height="3" rx="1.5" fill="#663399" opacity=".8"><animate attributeName="width" values="0;0.8" dur="1.5s" begin="0.8s" fill="freeze"/></rect>
<circle cx="46" cy="351" r="6" fill="#f1e05a" filter="url(#glow)"/><text x="62" y="356" class="mono" font-size="14" fill="#E6E8F2">JavaScript</text><text x="540" y="356" text-anchor="end" class="mono" font-size="14" fill="#9AA3C7">0.2%</text><rect x="62" y="364" width="0" height="3" rx="1.5" fill="#f1e05a" opacity=".8"><animate attributeName="width" values="0;0.8" dur="1.5s" begin="1.0s" fill="freeze"/></rect></svg>
